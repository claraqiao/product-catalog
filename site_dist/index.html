<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>產品型錄</title><link rel="stylesheet" href="/assets/site.css"></head><body><header class="top"><div class="brand"><a href="/">產品型錄</a></div><div class="tools"><input id="q" type="search" autocomplete="off" placeholder="搜尋產品編號、名稱或關鍵字" aria-label="搜尋產品"><select id="category" aria-label="依商品分類篩選"><option value="">全部分類</option></select><button id="share-catalog" type="button">分享型錄</button><span id="catalog-share-status" role="status" aria-live="polite"></span><button id="share-favorites" type="button">分享收藏清單</button><button id="favorites-only" type="button" aria-pressed="false">♡ 我的收藏 <span id="favorites-count">0</span></button><button id="cols" type="button">2 / 3 欄</button></div></header><main><div class="intro"><h1>產品型錄</h1><p>瀏覽產品照片與規格</p></div><nav id="category-shortcuts" class="category-shortcuts" aria-label="快速瀏覽商品分類"></nav><p id="count" class="count" role="status" aria-live="polite">載入產品資料中…</p><section id="grid" class="grid"></section><p id="empty" class="empty" hidden>找不到符合條件的產品。</p></main><div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="商品照片檢視" hidden><button class="close" id="close" aria-label="關閉照片">×</button><button class="nav prev" id="prev" aria-label="上一張照片">‹</button><div class="view-content"><img id="large" alt=""><p id="image-error" role="status" hidden>這張照片暫時無法顯示。<button id="retry-photo" type="button">重新載入這張照片</button></p><div id="viewer-thumbnails" class="viewer-thumbnails" aria-label="這款商品的照片"></div><div id="view-details" class="view-details" aria-live="polite"></div><div class="view-meta"><strong id="viewsku"></strong><span id="position"></span><button id="viewer-favorite" type="button" aria-pressed="false">♡ 收藏這款</button><button id="share-product" type="button" aria-label="分享這款商品">分享商品連結</button><span id="share-status" role="status" aria-live="polite"></span></div></div><button class="nav next" id="next" aria-label="下一張照片">›</button></div><script src="/assets/site.js" defer></script></body></html>
