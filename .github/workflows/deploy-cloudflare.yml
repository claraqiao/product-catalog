name: Deploy catalog to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment credentials exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets before deployment."
            exit 1
          fi
      - name: Check JavaScript syntax
        run: |
          node --check worker/index.js
          node --check admin/assets/admin.js
          node --check public/assets/site.js
      - name: Build and validate site
        run: |
          node tools/build_assets.mjs
          node tools/check_deploy_readiness.mjs
      - name: Run release safety checks
        run: |
          node tests/check_static.mjs
          node tests/check_spec_baseline.mjs
          node tests/check_photo_transition.mjs
          node tests/check_catalog_resilience.mjs
          node tests/check_storage_safety.mjs
          node tests/check_csv_security.mjs
          node tests/check_admin_csv_security.mjs
          node tests/check_backup.mjs
          node tests/check_settings.mjs
          node tests/check_release_gates.mjs
          node tests/check_admin_live_health.mjs
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/catalog-dry-run
      - name: Apply D1 migrations on Cloudflare
        run: npx wrangler d1 migrations apply product-catalog --remote --yes
      - name: Deploy Worker and site assets
        run: npx wrangler deploy
      - name: Explain verification still required
        run: |
          echo "Cloudflare deployment command completed; real site URL, login, photos and iPad acceptance must still be verified." >> "$GITHUB_STEP_SUMMARY"
          echo "No R2 billing or paid storage has been enabled by this workflow." >> "$GITHUB_STEP_SUMMARY"
