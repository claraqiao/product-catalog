name: Deploy catalog to Cloudflare (manual)
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        type: string
      confirm_database_migration:
        description: "Type MIGRATE to approve changes to the production D1 database schema"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: catalog-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY' && inputs.confirm_database_migration == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN GitHub secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret"; exit 1; }
      - name: Validate application and build assets
        run: |
          node --check worker/index.js
          node --check admin/assets/admin.js
          node --check public/assets/site.js
          node tools/build_assets.mjs
          node tools/check_deploy_readiness.mjs
          node tests/check_static.mjs
          node tests/check_backup.mjs
          node tests/check_settings.mjs
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply product-catalog --remote
      - name: Deploy Worker and website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify deployed website (read only)
        run: node tools/check_live_site.mjs https://product-catalog.clara0189.workers.dev
