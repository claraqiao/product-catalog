name: Free trial checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker/index.js
      - run: node --check admin/assets/admin.js
      - run: node --check public/assets/site.js
      - run: node --check tools/check_live_site.mjs
      - run: node --check tools/check_deploy_readiness.mjs
      - run: node tools/build_assets.mjs
      - run: node tools/check_deploy_readiness.mjs
      - run: node tests/check_static.mjs
      - run: node tests/check_spec_baseline.mjs
      - run: node tests/check_photo_transition.mjs
      - run: node tests/check_catalog_resilience.mjs
      - run: node tests/check_storage_safety.mjs
      - run: node tests/check_csv_security.mjs
      - run: node tests/check_admin_csv_security.mjs
      - run: node tests/check_backup.mjs
      - run: node tests/check_settings.mjs
      - name: Verify Cloudflare Worker bundles without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/catalog-worker-dry-run
      - name: Check database migrations locally
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib
          db = sqlite3.connect(':memory:')
          for p in sorted(pathlib.Path('migrations').glob('*.sql')):
              db.executescript(p.read_text())
          db.execute("INSERT INTO trial_image_objects VALUES (?,?,?,?)", ('test','image/webp',3,b'abc'))
          assert db.execute("SELECT data FROM trial_image_objects").fetchone()[0] == b'abc'
          print('Local migration and storage smoke test passed')
          PY
